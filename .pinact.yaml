# pinact's target files. Its default is .github/workflows alone; the sources
# under template/ are added, the Jinja ones included, since pinact reads any
# text file line by line: handed a .jinja source, `pinact run -u` moved each
# pin and `--verify-comment` refused a version comment that named the wrong
# tag. The Pins workflow updates them and the Template workflow verifies them.
version: 3
# pinact's minimum release age, the cooldown the rendered Dependabot
# configuration gives every repository: an update waits until the release is
# a week old. pinact v4 reads it here, from the CLI and from pinact-action.
min_age:
  value: 7
files:
  - pattern: .github/workflows/*.yml
  - pattern: template/.github/workflows/*.yml
  - pattern: template/.github/workflows/*.jinja
