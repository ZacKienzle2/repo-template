# Shared configuration for repositories that hold no Python; a Python
# repository is rendered from scientific-python/cookie instead. Each question
# is a fact about the repository that no tool can read from its files.

_answers_file: .copier-answers.yml

# Delimiters that keep every YAML, TOML and INI source valid in its own
# format: `# %` line statements read as comments and `(( ))` as plain scalars,
# so Renovate and prek read the sources as they are.
_envops:
  keep_trailing_newline: true
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "(("
  variable_end_string: "))"
  comment_start_string: "[#"
  comment_end_string: "#]"
  line_statement_prefix: "# %"
  line_comment_prefix: "# ~"

_skip_if_exists:
  - README.md

# The root is itself a render of these sources.
_subdirectory: template

_message_after_copy: |
  Written. Run `prek install` in every clone.

github_repository:
  type: str
  help: >-
    The repository as owner/name on GitHub. Issue form contact links, SUPPORT.md, CONTRIBUTING.md and CODEOWNERS are
    built from it.
  validator: "[% if not github_repository or '/' not in github_repository %]owner/name[% endif %]"

has_discussions:
  type: bool
  help: >-
    Are GitHub Discussions enabled? SUPPORT.md and the issue forms' contact links send questions there.
  default: true

is_public:
  type: bool
  help: >-
    Is the repository public? GitHub Actions is free on standard runners for a public repository and draws on the
    account's quota for a private one, so a private repository renders ci.yml alone.
  default: false

has_node:
  type: bool
  help: >-
    Does the repository hold JavaScript or TypeScript? .gitignore and .gitattributes then take github/gitignore's Node
    and gitattributes' Web blocks, and ci.yml runs the package scripts the repository defines.
  default: false

has_latex:
  type: bool
  help: >-
    Does the repository hold LaTeX? .gitignore then takes github/gitignore's TeX block, and a public repository renders
    the LaTeX workflow.
  default: false

latex_root:
  type: str
  help: >-
    Which file does latexmk build? The LaTeX workflow hands it to latex-action's root_file.
  default: main.tex
  when: "(( has_latex ))"

gitignore_own:
  type: yaml
  help: >-
    Paths only this repository produces, as a YAML list of patterns anchored to the root (/cache/, /outputs/).
  default: []

gitattributes_own:
  type: yaml
  help: >-
    Attribute lines only this repository needs, as a YAML list ("*.pdf filter=lfs diff=lfs merge=lfs -text").
  default: []

precommit_exclude_own:
  type: yaml
  help: >-
    Paths no hook should read or rewrite, as a YAML list of regular expressions anchored to the root ("vendor/.*\.sty"),
    read in verbose mode.
  default: []
