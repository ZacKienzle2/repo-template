# Shared repository configuration.
#
# The files this template owns were, before it existed, near-identical copies
# in five repositories: .yamllint.yaml agreed to 94 per cent across four,
# commitlint.config.cjs to 91, .markdownlint.yaml to 89, and the security
# workflows to 94 across three. 3711 lines were held that way, each edited by
# hand in every copy. Two changes went wrong that week for exactly that reason:
# an action input renamed in three repositories that pinned two different major
# versions, and a justification copied into a repository the reason did not
# apply to.
#
# Sharma, Fragkoulis and Spinellis name the duplicated block as a configuration
# smell in "Does your configuration code smell?" (MSR 2016,
# doi:10.1145/2901739.2901761), and Gallaba and McIntosh measure the same habit
# in continuous integration in "Use and Misuse of Continuous Integration
# Features" (TSE 2020, doi:10.1109/tse.2018.2838131).
#
# Every question below stands for a fact about the repository that changes what
# a configuration should say, and each was found by diffing the copies rather
# than imagined.

_answers_file: .copier-answers.yml

# The template's sources live here, so the repository root is an ordinary
# project that its own hooks can lint. Without the split, yamllint and the
# workflow schema check read the .jinja sources and reject the Jinja in them.
_subdirectory: template

_message_after_copy: |
  Written. Two things follow, in every clone:

    pre-commit install --install-hooks
    uvx --from 'sp-repo-review[cli]' repo-review .

  The second reports this repository against the Scientific Python
  Development Guide, which is the published standard these settings answer
  to.

_message_after_update: |
  Updated. A hunk that would not apply over a local edit is left as a
  conflict in the file, with git's own markers and the file unmerged in the
  index, which is copier's default and what `git status` reports as UU.

github_repository:
  type: str
  help: >-
    The repository as owner/name on GitHub. Issue form contact links, SUPPORT.md, CONTRIBUTING.md, CODEOWNERS and the
    changelog's commit and compare links are built from it. No default: copier hands a template a pure path for the
    destination, which cannot name the directory, so the first render is told and every update reads the answer back.
  validator: "{% if not github_repository or '/' not in github_repository %}owner/name{% endif %}"

has_cpp:
  type: bool
  help: >-
    Does the repository hold C or C++ built with CMake? clang keeps its own configuration in .clang-format and
    .clang-tidy, which are YAML by shape and clang's convention by content, so yamllint is told to leave them alone.
  default: false

has_generated_changelog:
  type: bool
  help: >-
    Is CHANGELOG.md generated, by git-cliff or another tool? A generator's template decides its blank lines, so the
    markdown rule about consecutive ones stops applying and the end-of-file fixer leaves the file alone.
  default: false

has_python:
  type: bool
  help: Does the repository hold Python?
  default: true

has_import_linter:
  type: bool
  help: >-
    Does the repository declare a layering contract in .importlinter? import-linter then checks it as a hook, whole
    tree, since a contract is about the graph rather than a file.
  default: false
  when: "{{ has_python }}"

mypy_overrides:
  type: yaml
  help: >-
    Per-module mypy sections, as a YAML mapping of module pattern to options (numba.*: {ignore_missing_imports: true}),
    rendered after the guide's global section in mypy.ini. mypy reads the first configuration file it finds and mypy.ini
    comes before pyproject.toml, so a repository's own overrides live here rather than in a section that file would
    shadow.
  default: {}
  when: "{{ has_python }}"

has_notebooks:
  type: bool
  help: Does the repository hold Jupyter notebooks?
  default: false

has_node:
  type: bool
  help: Does the repository hold JavaScript or TypeScript? CodeQL analyses it and the labeler marks it.
  default: false

gitignore_own:
  type: yaml
  help: >-
    Paths only this repository produces, as a YAML list of patterns anchored to the root (/cache/, /outputs/), rendered
    after the block assembled from github/gitignore. They live here rather than at the end of .gitignore so that file is
    entirely the template's and copier update never has to carry a hand-written tail forward.
  default: []

# Values every rendered file agrees on. A question with `when: false` is never
# asked and never recorded; its default is what every render uses, so the
# template is the one place any of them changes. Before this, the YAML width
# was 120 in prettier and .editorconfig but 140 in yamllint, and the commit
# width was 72 in CONTRIBUTING.md and VS Code but 100 in commitlint.
indent_width:
  type: int
  help: Indentation for code; .editorconfig, clang-format and VS Code read it.
  default: 4
  when: false

code_width:
  type: int
  help: Where clang-format, cmake-format and ruff wrap code.
  default: 100
  when: false

data_width:
  type: int
  help: Where prettier wraps YAML, JSON, JavaScript and CSS.
  default: 120
  when: false

prose_width:
  type: int
  help: Where prettier wraps Markdown prose.
  default: 80
  when: false

commit_width:
  type: int
  help: commitlint's limit for the header and each body line, which is git's own convention.
  default: 72
  when: false

python_version:
  type: str
  help: The Python every repository pins; .python-version, mypy's python_version and ruff's target read it.
  default: "3.12"
  when: false

commit_types:
  type: yaml
  help: >-
    Conventional Commits types as @commitlint/config-conventional's type-enum publishes them, each with the
    release-notes section it files under and the SemVer bump the specification assigns (feat is minor, fix and perf are
    patch; a breaking change is major through the breaking label). The labels, the release drafter and its autolabeler
    all render from this one list.
  default:
    - { type: feat, title: New Features, bump: minor, color: "a2eeef" }
    - { type: fix, title: Bug Fixes, bump: patch, color: "d73a4a" }
    - { type: perf, title: Performance, bump: patch, color: "fbca04" }
    - { type: docs, title: Documentation, bump: none, color: "0075ca" }
    - { type: refactor, title: Maintenance, bump: none, color: "c5def5" }
    - { type: test, title: Maintenance, bump: none, color: "bfd4f2" }
    - { type: build, title: Maintenance, bump: none, color: "fef2c0" }
    - { type: ci, title: Maintenance, bump: none, color: "fef2c0" }
    - { type: chore, title: Maintenance, bump: none, color: "ededed" }
    - { type: style, title: Maintenance, bump: none, color: "ededed" }
    - { type: revert, title: Maintenance, bump: none, color: "ededed" }
  when: false

has_latex:
  type: bool
  help: Does the repository hold LaTeX?
  default: false

latex_root:
  type: str
  help: >-
    Which file does latexmk build? The LaTeX workflow hands it to latex-action's root_file and names the PDF artefact
    after it.
  default: main.tex
  when: "{{ has_latex }}"

latex_shell_escape:
  type: bool
  help: >-
    Does the build need -shell-escape, as minted, tcolorbox listings and TikZ externalisation do? latexmk refuses the
    switch unless latex-action is told to pass it.
  default: false
  when: "{{ has_latex }}"
