# typos skips a repository's own .gitignore through its ignore-hidden default.
# The copies vendored under gitignore/ are the same lists of file extensions,
# *.fot and *.thm among them, so the type they map to is not spell-checked
# either.
[type.gitignore]
extend-glob = ["*.gitignore"]
check-file = false

# The LaTeX label patterns in template/_typos.toml.jinja list theorem
# environment names, and thm is one of those names rather than a misspelling.
[default.extend-words]
thm = "thm"
