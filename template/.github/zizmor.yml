# zizmor finds this file by itself, from the pre-commit hook and from
# zizmor-action alike, so both report the same findings.
#
# self-repository asks for GitHub's `$/` form of a same-repository action.
# actionlint 1.7.12 rejects that form, and its two open issues for it
# (rhysd/actionlint#711, #732) have no maintainer reply, so `./` stays and the
# audit is off until actionlint accepts `$/`. zizmor's configuration
# documentation prefers an ignore list to this, but a list names each workflow
# and grows with every one added, and every finding of this audit is the same
# conflict. The severity threshold this replaces hid every low finding, of
# every audit, from the hook.
rules:
  self-repository:
    disable: true
