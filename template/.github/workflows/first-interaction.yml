name: First Interaction

on:
  issues:
    types: [opened]
# The job reads the pull request and writes labels, assignees, a greeting or a
# draft; it never checks out or runs the pull request's code, which is the
# case zizmor's documentation names as the acceptable use of this trigger.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: first-interaction-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  welcome:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Greet
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            First issue. Acknowledgement within 7 days. Confirm reproduction
            steps, expected vs actual, environment. See SUPPORT.md.
          pr-message: >
            First PR. Confirm Conventional Commits, rebased on main, CI green.
            See CONTRIBUTING.md.
