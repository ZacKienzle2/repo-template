# The pins in the template's sources. Dependabot reads /.github/workflows and
# a file named .pre-commit-config.yaml alone, so the rendered root moves
# through it and the sources under template/ through the tools that read any
# path: pinact takes the files .pinact.yaml lists, and `pre-commit autoupdate`
# takes the hook source through --config, which the Jinja delimiters keep a
# valid YAML file. Both write into the checkout, and one pull request carries
# the result. autoupdate takes the newest tag reachable from a repository's
# default branch, which for pocc/pre-commit-hooks and gitleaks was older than
# the pin, so the review reads the diff before merging.
name: Pins

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pins
  cancel-in-progress: true

jobs:
  move:
    name: Move the pins in the sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # update moves each pin to its newest release and rewrites the version
      # comment; skip_push leaves the files in the checkout for the pull
      # request step, which is the hand-off the action documents.
      - name: Move the action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          config: .pinact.yaml
          update: "true"
          skip_push: "true"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Move the hook revisions
        run: uvx pre-commit autoupdate --config template/.pre-commit-config.yaml.jinja

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TEMPLATE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ci/pins
          delete-branch: true
          commit-message: "ci(template): move the pins to their current releases"
          title: "ci(template): move the pins to their current releases"
          body: |
            Each action pin moved by pinact and each hook revision by
            `pre-commit autoupdate`, in the sources under template/ and in
            the root workflows. A major version is here as well as a patch,
            so read the release notes of each before merging.
