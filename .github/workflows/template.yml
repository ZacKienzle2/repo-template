# Renders each answer set and runs the rendered repository's own hooks on it,
# then checks that the committed root is a render of the sources.
name: Template

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render ${{ matrix.name }} and run its hooks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            answers: ""
          - name: full
            answers: >-
              --data is_public=true --data has_latex=true --data has_node=true --data
              precommit_exclude_own=[vendor/.*]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Render the answer set
        run: |
          mkdir -p /tmp/generated
          cd /tmp/generated
          git init -q
          uvx copier copy --defaults --vcs-ref=HEAD --data "github_repository=${GITHUB_REPOSITORY}" ${{ matrix.answers }} "${GITHUB_WORKSPACE}" .
          git add -A

      - name: Run the rendered repository's hooks over its own tree
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          working-directory: /tmp/generated

  root:
    name: Check the root is a render of the sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Render the root again from its answers
        run: uvx copier recopy --force --quiet --vcs-ref=HEAD

      - name: Compare the render with the committed root
        run: |
          git add --all
          git diff --cached --exit-code -- . ':!.copier-answers.yml'
