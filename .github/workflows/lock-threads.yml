name: Lock threads

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

# The action's defaults lock issues, pull requests and discussions, and its
# README's example workflow grants the three scopes that needs.
permissions:
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: lock-threads

jobs:
  lock:
    name: Lock stale closed threads
    runs-on: ubuntu-latest
    steps:
      - name: Lock
        uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
