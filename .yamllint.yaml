extends: default

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent

# The generated ignore file already lists the caches and build directories, and
# yamllint reads it directly rather than keeping a second copy. The key is
# mutually exclusive with `ignore`, so the list is gone. .yamlignore holds only
# what is tracked and still not this project's YAML to format.
ignore-from-file: [.gitignore, .yamlignore]
